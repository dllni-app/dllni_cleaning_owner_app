# One-time recovery trigger; delete after the worker details patch is committed.
name: Apply Recurring Worker Details

on:
  push:
    branches:
      - feature/cleaning-suite-main
    paths:
      - '.github/workflows/apply-recurring-worker-details.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/cleaning-suite-main

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Apply recurring worker details patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('lib/features/orders/view/screens/order_details_screen.dart')
          text = path.read_text()

          replacements = [
              (
                  "import 'package:common_package/helpers/shared_preferences_helper.dart';\n",
                  "",
                  1,
              ),
              (
                  "  bool get _isEventAssistance =>\n      (_order.propertyType ?? '').trim().toLowerCase() == 'event_assistance';\n\n",
                  "",
                  1,
              ),
              (
                  "      if (_isEventAssistance) {\n        unawaited(_loadSchedule());\n      } else {\n        _scheduleChecked = true;\n      }",
                  "      unawaited(_loadSchedule());",
                  1,
              ),
              (
                  "    if (bookingId == null || !_isEventAssistance || _scheduleLoading) return;",
                  "    if (bookingId == null || _scheduleLoading) return;",
                  1,
              ),
              (
                  "            'تعذر تحميل أيام المناسبة. أعد المحاولة قبل تنفيذ أي إجراء.';",
                  "            'تعذر تحميل جلسات الطلب. أعد المحاولة قبل تنفيذ أي إجراء.';",
                  1,
              ),
              (
                  "    if (_isEventAssistance) {\n      unawaited(_loadSchedule());\n    }",
                  "    unawaited(_loadSchedule());",
                  1,
              ),
              (
                  "      if (_isEventAssistance) unawaited(_loadSchedule());",
                  "      unawaited(_loadSchedule());",
                  3,
              ),
              (
                  "              if (_isEventAssistance && !_scheduleChecked) {",
                  "              if (!_scheduleChecked) {",
                  1,
              ),
              (
                  "              if (_isEventAssistance && _scheduleLoadError != null) {",
                  "              if (_scheduleLoadError != null) {",
                  1,
              ),
          ]

          for old, new, expected in replacements:
              count = text.count(old)
              if count != expected:
                  raise SystemExit(
                      f'Expected {expected} matches, found {count}: {old!r}'
                  )
              text = text.replace(old, new)

          path.write_text(text)
          PY

      - name: Format worker details source
        run: dart format lib/features/orders/view/screens/order_details_screen.dart

      - name: Analyze worker multi-session sources
        run: |
          flutter analyze \
            lib/features/orders/view/screens/order_details_screen.dart \
            lib/features/orders/data/models/worker_booking_schedule_model.dart \
            lib/features/orders/data/source/worker_session_remote_data_source.dart \
            lib/features/orders/view/widgets/accept_order_bottom_sheet.dart \
            lib/features/orders/view/widgets/order_details/multi_day_order_details_body.dart

      - name: Run multi-session model tests
        run: flutter test test/features/orders/data/models/worker_booking_schedule_model_test.dart

      - name: Commit recurring worker details support
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/orders/view/screens/order_details_screen.dart
          if git diff --cached --quiet; then
            echo "No worker details changes to commit."
            exit 0
          fi
          git commit -m "feat(cleaning): enable recurring multi-session worker details"
          git push origin HEAD:feature/cleaning-suite-main
