name: Apply Recurring Worker Dev Once

on:
  push:
    branches:
      - feature/cleaning-suite-dev
    paths:
      - '.github/workflows/apply-recurring-worker-dev-once.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cleaning-suite-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Port generic multi-session details flow
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('lib/features/orders/view/screens/order_details_screen.dart')
          text = path.read_text()
          replacements = [
              (
                  "import 'package:common_package/helpers/shared_preferences_helper.dart';\n",
                  "",
                  1,
              ),
              (
                  "  bool get _isEventAssistance =>\n      (_order.propertyType ?? '').trim().toLowerCase() == 'event_assistance';\n\n",
                  "",
                  1,
              ),
              (
                  "      if (_isEventAssistance) {\n        unawaited(_loadSchedule());\n      } else {\n        _scheduleChecked = true;\n      }",
                  "      unawaited(_loadSchedule());",
                  1,
              ),
              (
                  "    if (bookingId == null || !_isEventAssistance || _scheduleLoading) return;",
                  "    if (bookingId == null || _scheduleLoading) return;",
                  1,
              ),
              (
                  "        _scheduleLoadError =\n            'تعذر تحميل أيام المناسبة. أعد المحاولة قبل تنفيذ أي إجراء.';",
                  "        _scheduleLoadError =\n            'تعذر تحميل جلسات الطلب. أعد المحاولة قبل تنفيذ أي إجراء.';",
                  1,
              ),
              (
                  "    if (_isEventAssistance) {\n      unawaited(_loadSchedule());\n    }",
                  "    unawaited(_loadSchedule());",
                  1,
              ),
              (
                  "if (_isEventAssistance) unawaited(_loadSchedule());",
                  "unawaited(_loadSchedule());",
                  3,
              ),
              (
                  "if (_isEventAssistance && !_scheduleChecked)",
                  "if (!_scheduleChecked)",
                  1,
              ),
              (
                  "if (_isEventAssistance && _scheduleLoadError != null)",
                  "if (_scheduleLoadError != null)",
                  1,
              ),
          ]
          for old, new, expected in replacements:
              count = text.count(old)
              if count != expected:
                  raise SystemExit(
                      f'Expected {expected} matches, found {count}: {old[:100]!r}'
                  )
              text = text.replace(old, new)
          if '_isEventAssistance' in text:
              raise SystemExit('Unexpected remaining _isEventAssistance reference')
          path.write_text(text)
          PY
      - name: Format worker details and tests
        run: |
          dart format \
            lib/features/orders/view/screens/order_details_screen.dart \
            test/features/orders/data/models/worker_booking_schedule_model_test.dart
      - name: Analyze worker multi-session sources
        run: |
          flutter analyze \
            lib/features/orders/data/models/worker_booking_schedule_model.dart \
            lib/features/orders/data/source/worker_session_remote_data_source.dart \
            lib/features/orders/view/screens/order_details_screen.dart \
            lib/features/orders/view/widgets/accept_order_bottom_sheet.dart
      - name: Run worker model tests
        run: flutter test test/features/orders/data/models/worker_booking_schedule_model_test.dart
      - name: Commit worker dev port
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/features/orders/view/screens/order_details_screen.dart \
            test/features/orders/data/models/worker_booking_schedule_model_test.dart
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(cleaning): enable recurring multi-session details on dev"
          git push origin HEAD:feature/cleaning-suite-dev
