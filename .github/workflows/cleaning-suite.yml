name: Cleaning Suite Worker

on:
  push:
    branches:
      - feature/cleaning-suite-main
    paths:
      - 'lib/core/di/injection.dart'
      - 'lib/core/location/location_reporter.dart'
      - 'lib/core/location/worker_location_tracker.dart'
      - 'lib/features/orders/data/models/worker_booking_schedule_model.dart'
      - 'lib/features/orders/data/source/worker_session_remote_data_source.dart'
      - 'lib/features/orders/view/widgets/accept_order_bottom_sheet.dart'
      - 'lib/features/orders/view/widgets/order_details/multi_day_order_details_body.dart'
      - 'test/features/orders/data/models/worker_booking_schedule_model_test.dart'
      - '.github/workflows/cleaning-suite.yml'
  pull_request:
    paths:
      - 'lib/core/di/injection.dart'
      - 'lib/core/location/location_reporter.dart'
      - 'lib/core/location/worker_location_tracker.dart'
      - 'lib/features/orders/data/models/worker_booking_schedule_model.dart'
      - 'lib/features/orders/data/source/worker_session_remote_data_source.dart'
      - 'lib/features/orders/view/widgets/accept_order_bottom_sheet.dart'
      - 'lib/features/orders/view/widgets/order_details/multi_day_order_details_body.dart'
      - 'test/features/orders/data/models/worker_booking_schedule_model_test.dart'
      - '.github/workflows/cleaning-suite.yml'

permissions:
  contents: write

jobs:
  multi-session-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format multi-session lifecycle sources
        run: |
          dart format \
            lib/core/di/injection.dart \
            lib/core/location/location_reporter.dart \
            lib/core/location/worker_location_tracker.dart \
            lib/features/orders/data/models/worker_booking_schedule_model.dart \
            lib/features/orders/data/source/worker_session_remote_data_source.dart \
            lib/features/orders/view/widgets/accept_order_bottom_sheet.dart \
            lib/features/orders/view/widgets/order_details/multi_day_order_details_body.dart \
            test/features/orders/data/models/worker_booking_schedule_model_test.dart

      - name: Commit formatter output
        if: github.event_name == 'push'
        shell: bash
        run: |
          git add \
            lib/core/di/injection.dart \
            lib/core/location/location_reporter.dart \
            lib/core/location/worker_location_tracker.dart \
            lib/features/orders/data/models/worker_booking_schedule_model.dart \
            lib/features/orders/data/source/worker_session_remote_data_source.dart \
            lib/features/orders/view/widgets/accept_order_bottom_sheet.dart \
            lib/features/orders/view/widgets/order_details/multi_day_order_details_body.dart \
            test/features/orders/data/models/worker_booking_schedule_model_test.dart
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(cleaning): format worker session lifecycle sources'
          git push

      - name: Analyze multi-session lifecycle sources
        run: |
          flutter analyze \
            lib/core/di/injection.dart \
            lib/core/location/location_reporter.dart \
            lib/core/location/worker_location_tracker.dart \
            lib/features/orders/data/models/worker_booking_schedule_model.dart \
            lib/features/orders/data/source/worker_session_remote_data_source.dart \
            lib/features/orders/view/widgets/accept_order_bottom_sheet.dart \
            lib/features/orders/view/widgets/order_details/multi_day_order_details_body.dart

      - name: Run multi-session model tests
        run: |
          flutter test \
            test/features/orders/data/models/worker_booking_schedule_model_test.dart
