name: Cleaning Suite Worker

on:
  push:
    branches:
      - feature/cleaning-suite-dev
    paths:
      - 'lib/features/orders/data/models/worker_booking_schedule_model.dart'
      - 'lib/features/orders/data/source/worker_session_remote_data_source.dart'
      - 'lib/features/orders/view/widgets/accept_order_bottom_sheet.dart'
      - '.github/workflows/cleaning-suite.yml'
  pull_request:
    paths:
      - 'lib/features/orders/data/models/worker_booking_schedule_model.dart'
      - 'lib/features/orders/data/source/worker_session_remote_data_source.dart'
      - 'lib/features/orders/view/widgets/accept_order_bottom_sheet.dart'
      - '.github/workflows/cleaning-suite.yml'

permissions:
  contents: write

jobs:
  multi-session-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format multi-session sources
        run: |
          dart format \
            lib/features/orders/data/models/worker_booking_schedule_model.dart \
            lib/features/orders/data/source/worker_session_remote_data_source.dart \
            lib/features/orders/view/widgets/accept_order_bottom_sheet.dart

      - name: Commit formatter output
        if: github.event_name == 'push'
        shell: bash
        run: |
          git add \
            lib/features/orders/data/models/worker_booking_schedule_model.dart \
            lib/features/orders/data/source/worker_session_remote_data_source.dart \
            lib/features/orders/view/widgets/accept_order_bottom_sheet.dart
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(cleaning): format worker multi-session sources'
          git push

      - name: Analyze multi-session sources
        run: |
          flutter analyze \
            lib/features/orders/data/models/worker_booking_schedule_model.dart \
            lib/features/orders/data/source/worker_session_remote_data_source.dart \
            lib/features/orders/view/widgets/accept_order_bottom_sheet.dart
